[package]
name = "openab-pty"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenAB PTY runtime — remote sandboxed terminal sessions over WebSocket (internal, unpublished)"

[dependencies]
# DEFERRED to Gate B: trimming `full` to the feature set actually used. `full` is
# a build-time cost only, this crate is unpublished and ships no image, and the
# trim is a per-feature bisect that has to be redone as the crate changes. It
# belongs with the first published image, where binary size starts to matter.
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
subtle = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.29"

[workspace]
