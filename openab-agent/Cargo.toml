[package]
name = "openab-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust coding agent with built-in ACP support"

[dependencies]
# Shared MCP runtime + auth.json layer + LLM type layer + HostBridge —
# extracted so the broker can host the OAB MCP Facade in-process (ADR §6.2).
# This crate re-exports them as `crate::{mcp,auth}` and from `crate::{llm,acp}`.
openab-mcp = { path = "../crates/openab-mcp" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22.1"
url = "2.5.8"
# rmcp model/service types still surface in the ACP layer (sampling bridge).
rmcp = { version = "1.7", default-features = false, features = ["client"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
temp-env = { version = "0.3.6", features = ["async_closure"] }
