# ═══ Schema 3 — platform-quirks (freeform, dated findings log) ═══════════════

[[quirks]]
date = "2026-08-20"
title = "Operator cron uses exact Gateway-local persistent routing"
note = "PR 12 permits Teams only in operator baseline config with both tenant and conversation IDs. A separate default-false capability gates an additive non-secret target; old peers, disconnected Standalone Core, registry-off state, unsupported consumer topology, and inactive exact keys stop before Connector HTTP or ACP. The first visible trigger needs a real activity ID. Every later write re-resolves the active record; no persistent write retries an ambiguous or rate-limited outcome. Delivered clears one prior exact forbidden result, while only two consecutive MessageWritesBlocked or BotNotInConversationRoster outcomes disable. Usercron and reminders remain unauthorized."
kind = "openab_decision"
source = "docs/adr/teams-operator-cron-delivery.md"

[[quirks]]
date = "2026-08-19"
title = "Persistent conversation authority requires post-trust promotion"
note = "PR 11 adds an explicit-path opt-in, versioned Gateway-local registry. New Core requests `register_conversation` only after structural, typed L2, and L3 Allow; Gateway resolves the origin event to its authenticated ephemeral route and persists app/tenant/Bot-Framework-channel/conversation identity plus validated service URL. The wire carries no service URL or serialized reference. Active/disabled records expire after the configured TTL; authenticated installation removal records revocation. This registry does not implement proactive send or cron."
kind = "openab_decision"
source = "docs/adr/teams-trusted-persistent-conversation-registry.md"

[[quirks]]
date = "2026-08-08"
title = "Progressive content uses one outcome-aware placeholder"
note = "Default off. `[teams].streaming = true` is selected only after real-ID send and bot-owned edit/delete capabilities are proven. One turn reuses one process-local activity ID; cosmetic edits are changed-content-only and stop after three failures. Final PUT Rejected permits bounded delete-plus-fresh-send recovery, while any Unknown suppresses delete, retry, fresh final, and warning activities. Status messages and queued reactions remain separate lifecycles."
kind = "openab_decision"
source = "docs/adr/teams-progressive-response.md"

[[quirks]]
date = "2026-08-07"
title = "Processing indicator is one turn-local bot-owned message"
note = "Default off. With `[teams].processing_indicator = \"message\"`, Core creates at most one status activity through the authenticated origin route, updates that same real bot-owned activity ID for thinking/tool/terminal states, marks it terminal before final content, and deletes it after complete delivery. Standalone requires negotiated send/edit/delete ACK plus additive command targets; no Graph/RSC or streaming placeholder is used."
kind = "openab_decision"
source = "docs/adr/teams-processing-indicator.md"

[[quirks]]
date = "2026-08-07"
title = "serviceUrl remains gateway-local in bounded ephemeral route state"
note = "For message activities, Teams requires non-empty Bot Framework channel, tenant, conversation, activity, sender, and service URL fields. The validated service URL is stored only in process-local route and bot-owned state; default TTL is 3600 s with independent 10000-entry route, dedupe, and ownership bounds. Outbound replies use this state directly; missing required fields return 400."
kind = "openab_decision"
source = "docs/adr/teams-ephemeral-ingress-state.md"

[[quirks]]
date = "2026-07-04"
title = "Sender identity: from.id vs aadObjectId"
note = "Verified: the adapter uses `activity.from.id` (the `29:1abc...` Bot Framework/Teams user id) as `SenderInfo.id`, not `from.aadObjectId`. `aadObjectId` (Entra object id) is deserialized but unused — it can be null for guests/anonymous users, whereas `from.id` is always present and stable, so it's the correct trust-gate key. Tenant is resolved with fallbacks: top-level `tenant.id` → `channelData.tenant.id` → `conversation.tenantId` because Teams places it differently for personal vs channel webhooks (tests pin this)."
kind = "openab_decision"
source = "crates/openab-gateway/src/adapters/teams.rs#handle_reply"

[[quirks]]
date = "2026-08-08"
title = "Reply correlation and explicit quote targets have separate identifiers"
note = "`reply_to` remains the OpenAB origin event ID and is used only to find authenticated route state. Normal sends do not copy it into Bot Connector `replyToId`. An explicit `quote_message_id` is emitted as `replyToId` only when known in the same app/tenant/conversation scope; otherwise Teams receives a plain send. The resulting visual UX is still unverified in a live tenant."
kind = "openab_decision"
source = "docs/adr/teams-real-send-acknowledgement.md"

[[quirks]]
date = "2026-07-04"
title = "Auth is heavier than most adapters (endorsements + serviceUrl claim)"
note = "JWT validation goes beyond signature/aud/iss/exp: it also enforces (B2) that the signing JWK endorses the activity's `channelId` and (B1) that the token's `serviceurl` claim equals the activity's `serviceUrl` — binding the token to the specific channel/service origin. JWKS keys are cached (1 h TTL) with a force-refresh-on-cache-miss path for Microsoft key rotation. The activity body is parsed before JWT auth (Bot Framework needs `serviceUrl`/`channelId` from the body to validate) — this is why the pre-auth body is capped at 256 KB."
kind = "intrinsic"
source = "https://learn.microsoft.com/en-us/azure/bot-service/rest-api/bot-framework-rest-connector-authentication?view=azure-bot-service-4.0"

[[quirks]]
date = "2026-08-07"
title = "Accepted activity retries are process-locally deduplicated"
note = "The composite key `(app_id, tenant_id, conversation_id, activity_id)` follows Vacant → Publishing → Accepted. Concurrent duplicates share the owner's local broadcast result; accepted duplicates return 200 without republishing. No consumer or local publish failure returns 503 and removes Publishing state, so a later retry is not blocked. Default dedupe TTL is 600 s and state is bounded to 10000 entries. This is not durable or cross-replica idempotency."
kind = "openab_decision"
source = "docs/adr/teams-ephemeral-ingress-state.md"

[[quirks]]
date = "2026-08-06"
title = "Bot Connector transport is pinned to public cloud and fails closed"
note = "M0 accepts HTTPS Bot Connector service URLs only on `smba.trafficmanager.net`, public-cloud OAuth/OpenID hosts only, no userinfo/query/fragment/non-standard ports, and no cross-origin redirects. Conversation/activity IDs are encoded as URL path segments. Connect/request timeouts are 5 s/10 s; error bodies are read up to 4 KiB and redacted. OAuth, OpenID metadata, and JWKS refreshes are single-flight."
kind = "openab_decision"
source = "crates/openab-gateway/src/adapters/teams.rs"

[[quirks]]
date = "2026-08-09"
title = "Unsupported write-side commands fail closed"
note = "Teams supports commandless sends plus bot-owned edit/delete. Reactions remain a no-op unless the public-preview opt-in is enabled; `create_topic` and unknown commands return a structured `unsupported_command` rejection before route lookup or network I/O, preventing unsupported commands from becoming plain sends."
kind = "openab_decision"
source = "crates/openab-gateway/src/adapters/teams.rs#handle_reply"

[[quirks]]
date = "2026-08-09"
title = "Edit and delete require process-local bot ownership"
note = "A confirmed send records `(app, tenant, conversation, activity)` ownership. New commands carry an additive `target_message_id` while preserving origin-event `reply_to`; old peers use a unique legacy target fallback. Same-conversation writes use fixed bounded lock shards. PUT/DELETE retry at most once only after explicit `429` with `Retry-After` no greater than one second; timeouts and 5xx remain unknown."
kind = "openab_decision"
source = "docs/adr/teams-owned-message-mutations.md"

[[quirks]]
date = "2026-08-10"
title = "OpenAB uses an exact conservative UTF-16 text budget"
note = "New Teams peers advertise 80,000 UTF-16 bytes (decimal) and Core measures final rendered text exactly, including synthetic code-fence markers. Required-ACK chunks stop at the first non-delivered outcome; Unknown never causes a retry or fresh warning activity. Legacy and no-hello peers remain at 4096 characters."
kind = "openab_decision"
source = "docs/adr/teams-formatting-and-long-messages.md"

[[quirks]]
date = "2026-07-04"
title = "Bot message budget is ~100 KB UTF-16"
note = "Bot message budget is ~100 KB UTF-16 (text + image links + mentions + reactions, excl. base64 images); recommend ≤80 KB, over-limit returns `413 RequestEntityTooLarge` / `MessageSizeTooBig`."
kind = "intrinsic"
source = "https://learn.microsoft.com/en-us/microsoftteams/platform/bots/how-to/format-your-bot-messages"

[[quirks]]
date = "2026-07-04"
title = "Send rate limits"
note = "Per-bot-per-thread send limits 7/1s, 8/2s, 60/30s, 1800/3600s; global 50 RPS per app per tenant; throttle → `429` (retry `412`/`502`/`504` too), use exponential backoff."
kind = "intrinsic"
source = "https://learn.microsoft.com/en-us/microsoftteams/platform/bots/how-to/rate-limit"

[[quirks]]
date = "2026-07-04"
title = "suggestedActions constraints"
note = "`suggestedActions` support `imBack` only, ≤6 buttons, one-on-one chats only, and not alongside attachments (any conversation type)."
kind = "intrinsic"
source = "https://learn.microsoft.com/en-us/microsoftteams/platform/bots/build-conversational-capability"

[[quirks]]
date = "2026-07-04"
title = "Outbound picture limits"
note = "Outbound pictures ≤1024×1024 px, ≤1 MB, PNG/JPEG/GIF; animated GIF unsupported; Markdown inline image defaults to 256×256."
kind = "intrinsic"
source = "https://learn.microsoft.com/en-us/microsoftteams/platform/bots/build-conversational-capability"

[[quirks]]
date = "2026-08-09"
title = "Reaction transport is opt-in public preview"
note = "Bots can add/remove reactions through Bot Connector without Graph/RSC and receive `messageReaction` events. OpenAB implements outbound add/remove only when explicitly enabled, with authenticated target scope and a bounded 429 retry; inbound reaction events remain deferred. Microsoft documents a two-reactions-per-second limit."
kind = "openab_decision"
source = "docs/adr/teams-message-reactions-preview.md"

[[quirks]]
date = "2026-07-04"
title = "Bot can edit/delete only its own messages"
note = "Bot can edit (`PUT .../activities/{activityId}`) and delete (`DELETE .../activities/{activityId}`) its own messages but never user messages."
kind = "intrinsic"
source = "https://learn.microsoft.com/en-us/microsoftteams/platform/bots/how-to/update-and-delete-bot-messages"

[[quirks]]
date = "2026-07-04"
title = "No native bot slash-command protocol"
note = "No native bot slash-command protocol; command menus arrive as plain `message` activities and must be text-parsed."
kind = "intrinsic"
source = "https://learn.microsoft.com/en-us/microsoftteams/platform/bots/how-to/create-a-bot-commands-menu"

[[quirks]]
date = "2026-07-04"
title = "Bot only receives @mentioned messages in channels/group chats"
note = "In channels/group chats a bot only receives messages where it is @mentioned (unless RSC); mentions live in `entities[]` (`type: mention`, `mentioned.id`/`.name`), not the text markup."
kind = "intrinsic"
source = "https://learn.microsoft.com/en-us/microsoftteams/platform/bots/how-to/conversations/channel-and-group-conversations"

[[quirks]]
date = "2026-07-04"
title = "Verified sender id = activity.from.id"
note = "Verified sender id = `activity.from.id` (`29:...`), not `aadObjectId`; adapter forwards `from.id` as trust-gate key."
kind = "openab_decision"
source = "crates/openab-gateway/src/adapters/teams.rs"

[[quirks]]
date = "2026-08-08"
title = "Real send acknowledgement is implemented; reply-chain UX remains live-gated"
note = "Teams resolves `reply_to` only as an `event_id` route index, returns the real outbound activity ID, and reports delivered/rejected/unknown outcomes in Standalone and Unified modes. Normal sends omit `replyToId`; explicit route-scoped quotes may set it. Typed scope and mentions are handled separately; inbound attachments remain future work."
kind = "openab_decision"
source = "docs/adr/teams-real-send-acknowledgement.md"
