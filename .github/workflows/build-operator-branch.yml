name: Build Operator (Branch)

on:
  push:
    branches:
      - "operator/**"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          # The macmini runner .env sets CARGO_HOME=/Users/pahud/ci-rust/cargo (internal
          # disk). ~/.cargo is a symlink onto the external RAID; rustup would install
          # there if CARGO_HOME were unset, so fail closed instead of falling back.
          : "${CARGO_HOME:?CARGO_HOME must be set by the runner .env}"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          test -x "$CARGO_HOME/bin/cargo"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build (aarch64-apple-darwin)
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/openab dist/
          cd dist && tar czf ../openab-macos-arm64.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openab-macos-arm64
          path: openab-macos-arm64.tar.gz
          retention-days: 7
